[project]
name = "nind-denoise"
version = "0.1.0"
description = "Master thesis on natural image noise removal using Convolutional Neural Networks. Works with the Natural Image Noise Dataset to apply to real photographs, using a UNet network architecture by default."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "configargparse>=1.7.5",
    "opencv-python>=4.13.0.92",
    "piqa>=1.3.2",
    "pyyaml>=6.0.3",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "rawpy>=0.27.0",
]
